<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Tajawal', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Cairo', system-ui, sans-serif; margin: 0; }
    p { margin: 0; }
    a { color: #1B3A6B; text-decoration: none; } a:hover { color: #24508F; }
    .zh { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; min-height: 844px; background: linear-gradient(172deg, #1B3A6B 0%, #16294A 55%, #0F1F3A 100%); color: #F7F4EF; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- زخرفة الجسر -->
  <svg width="390" height="220" viewBox="0 0 390 220" fill="none" style="position: absolute; top: 96px; inset-inline-start: -10px; opacity: .12;">
    <path d="M-20 190 C 70 60, 250 60, 340 190" stroke="#D4AF37" stroke-width="2.5"/>
    <path d="M40 190 C 110 92, 240 92, 310 190" stroke="#C8102E" stroke-width="2.5"/>
    <path d="M-20 191 H 400" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M80 191 V 132" stroke="#D4AF37" stroke-width="1.2"/>
    <path d="M175 191 V 108" stroke="#D4AF37" stroke-width="1.2"/>
    <path d="M270 191 V 132" stroke="#D4AF37" stroke-width="1.2"/>
  </svg>
  <span class="zh" style="position: absolute; top: 28px; inset-inline-end: -18px; font-size: 150px; font-weight: 900; color: rgba(247,244,239,.04); line-height: 1;">好</span>

  <div style="position: relative; padding: 52px 22px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1;">

    <!-- وسام -->
    <div style="position: relative; width: 108px; height: 108px;">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <circle cx="54" cy="54" r="48" fill="none" stroke="rgba(212,175,55,.25)" stroke-width="5"/>
        <circle cx="54" cy="54" r="48" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="0" transform="rotate(-90 54 54)"/>
      </svg>
      <div style="position: absolute; inset: 14px; border-radius: 50%; background: rgba(212,175,55,.14); display: grid; place-items: center;">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
      <h1 style="font-size: 27px; font-weight: 900; line-height: 1.35;">أتممت الوحدة</h1>
      <p style="font-size: 14.5px; color: #A9C3E4; line-height: 1.7;">بلدي وجنسيتي — الدرس ٣</p>
    </div>

    <!-- أرقام الجلسة -->
    <div style="width: 100%; display: flex; gap: 10px; padding-top: 6px;">
      <div style="flex: 1; padding: 15px 10px; border-radius: 15px; background: rgba(247,244,239,.07); border: 1px solid rgba(247,244,239,.10); display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-family: 'Cairo'; font-size: 22px; font-weight: 800; color: #D4AF37;">٨</span>
        <span style="font-size: 11px; color: #A9C3E4;">كلمات جديدة</span>
      </div>
      <div style="flex: 1; padding: 15px 10px; border-radius: 15px; background: rgba(247,244,239,.07); border: 1px solid rgba(247,244,239,.10); display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-family: 'Cairo'; font-size: 22px; font-weight: 800; color: #D4AF37;">٩٣٪</span>
        <span style="font-size: 11px; color: #A9C3E4;">دقّتك</span>
      </div>
      <div style="flex: 1; padding: 15px 10px; border-radius: 15px; background: rgba(247,244,239,.07); border: 1px solid rgba(247,244,239,.10); display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-family: 'Cairo'; font-size: 22px; font-weight: 800; color: #D4AF37;">٦:١٢</span>
        <span style="font-size: 11px; color: #A9C3E4;">دقيقة</span>
      </div>
    </div>

    <!-- السلسلة -->
    <div style="width: 100%; padding: 15px 17px; border-radius: 16px; background: rgba(212,175,55,.12); border: 1px solid rgba(212,175,55,.38); display: flex; align-items: center; gap: 13px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.9" stroke-linecap="round" style="flex: none;"><path d="M12 3c0 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-5 2 1 3 3 3 5a6 6 0 0 1-12 0c0-5 6-6 6-9Z"/></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Cairo'; font-size: 15px; font-weight: 800; color: #D4AF37;">سلسلتك ٨ أيام</span>
        <span style="font-size: 12px; color: #A9C3E4;">أربعة أيام تفصلك عن رقمك القياسي</span>
      </div>
    </div>

    <!-- كلمة دخلت المراجعة -->
    <div style="width: 100%; padding: 16px 17px; border-radius: 16px; background: rgba(247,244,239,.055); border: 1px solid rgba(247,244,239,.09); display: flex; flex-direction: column; gap: 11px;">
      <span style="font-size: 11.5px; font-weight: 700; letter-spacing: .07em; color: #6E97D0;">دخلت جدول مراجعتك</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="zh" style="padding: 7px 12px; border-radius: 9px; background: rgba(247,244,239,.09); font-size: 15px;">中国</span>
        <span class="zh" style="padding: 7px 12px; border-radius: 9px; background: rgba(247,244,239,.09); font-size: 15px;">法国</span>
        <span class="zh" style="padding: 7px 12px; border-radius: 9px; background: rgba(247,244,239,.09); font-size: 15px;">泰国</span>
        <span class="zh" style="padding: 7px 12px; border-radius: 9px; background: rgba(247,244,239,.09); font-size: 15px;">国</span>
        <span class="zh" style="padding: 7px 12px; border-radius: 9px; background: rgba(247,244,239,.09); font-size: 15px;">人</span>
        <span style="padding: 7px 12px; border-radius: 9px; background: rgba(212,175,55,.16); font-size: 12px; color: #D4AF37;">+ ٣</span>
      </div>
      <p style="font-size: 12px; line-height: 1.65; color: #A9C3E4; padding-top: 9px; border-top: 1px solid rgba(212,175,55,.28);">أول مراجعة لها غداً — دقيقتان تكفيان لتثبيتها.</p>
    </div>
  </div>

  <div style="position: relative; padding: 18px 22px 26px; display: flex; flex-direction: column; gap: 10px;">
    <button style="width: 100%; min-height: 56px; border: 0; border-radius: 15px; background: #D4AF37; color: #16294A; font-family: 'Cairo'; font-size: 16.5px; font-weight: 800; cursor: pointer;">الوحدة التالية — اللغات التي أتحدثها</button>
    <button style="width: 100%; min-height: 48px; border: 1px solid rgba(247,244,239,.22); border-radius: 14px; background: transparent; color: #D6E3F2; font-family: 'Tajawal'; font-size: 14px; font-weight: 500; cursor: pointer;">اكتفيت اليوم</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
