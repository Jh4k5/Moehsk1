<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Tajawal', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Cairo', system-ui, sans-serif; margin: 0; }
    p { margin: 0; }
    a { color: #1B3A6B; text-decoration: none; } a:hover { color: #24508F; }
    .zh { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; min-height: 844px; background: #F7F4EF; color: #2A2A2A; display: flex; flex-direction: column;">

  <div style="padding: 18px 16px 12px; display: flex; align-items: center; gap: 12px;">
    <button style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div style="flex: 1; height: 9px; border-radius: 999px; background: rgba(42,42,42,.10); overflow: hidden;"><div style="width: 21%; height: 100%; border-radius: 999px; background: #1B3A6B;"></div></div>
    <span style="font-size: 12px; font-weight: 700; color: #6E6E6E; flex: none;">٣/١٤</span>
  </div>

  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 16px; flex: 1;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 26px; height: 26px; border-radius: 8px; background: rgba(27,58,107,.1); display: grid; place-items: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B3A6B" stroke-width="1.9" stroke-linecap="round"><path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4Z"/><path d="M20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7Z"/></svg>
      </span>
      <span style="font-size: 13px; font-weight: 700; color: #1B3A6B;">كلمة جديدة</span>
      <span style="margin-inline-start: auto; font-size: 11.5px; color: #8A8A8A;">٣ من ٨ كلمات</span>
    </div>

    <!-- بطاقة الحرف -->
    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(42,42,42,.08); overflow: hidden; box-shadow: 0 12px 30px -24px rgba(15,31,58,.55);">
      <div style="background: linear-gradient(160deg, #1B3A6B, #16294A); padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; overflow: hidden;">
        <svg width="240" height="90" viewBox="0 0 240 90" fill="none" style="position: absolute; bottom: -14px; inset-inline-start: -20px; opacity: .13;">
          <path d="M0 78 C 50 22, 140 22, 190 78" stroke="#D4AF37" stroke-width="2"/><path d="M0 79 H 230" stroke="#D4AF37" stroke-width="1.2"/>
        </svg>
        <span class="zh" style="position: relative; font-size: 76px; font-weight: 700; color: #F7F4EF; line-height: 1;">中国</span>
        <span style="position: relative; font-size: 15px; color: #D4AF37; letter-spacing: .04em;">Zhōngguó</span>
        <div style="position: relative; display: flex; gap: 6px;">
          <span style="padding: 3px 10px; border-radius: 6px; background: rgba(36,80,143,.55); font-size: 11px; color: #D6E3F2;">نبرة ١</span>
          <span style="padding: 3px 10px; border-radius: 6px; background: rgba(27,127,75,.4); font-size: 11px; color: #D6E3F2;">نبرة ٢</span>
        </div>
        <button style="position: relative; margin-top: 4px; display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 20px; border: 1px solid rgba(212,175,55,.5); border-radius: 12px; background: rgba(212,175,55,.14); cursor: pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          <span style="font-size: 13.5px; font-weight: 700; color: #D4AF37;">استمع</span>
        </button>
      </div>

      <div style="padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #8A6D12;">المعنى</span>
          <span style="font-family: 'Cairo'; font-size: 22px; font-weight: 800;">الصين</span>
        </div>

        <!-- تفكيك الجذور -->
        <div style="padding-top: 14px; border-top: 1px solid rgba(212,175,55,.35); display: flex; flex-direction: column; gap: 11px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #8A6D12;">من أي شيء يتكوّن</span>
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="flex: 1; padding: 11px 8px; border-radius: 11px; background: rgba(27,58,107,.055); display: flex; flex-direction: column; align-items: center; gap: 3px;">
              <span class="zh" style="font-size: 26px; font-weight: 700; color: #1B3A6B; line-height: 1;">中</span>
              <span style="font-size: 11px; color: #4A4A4A;">وسط</span>
            </div>
            <span style="font-family: 'Cairo'; font-size: 17px; font-weight: 800; color: #D4AF37; flex: none;">+</span>
            <div style="flex: 1; padding: 11px 8px; border-radius: 11px; background: rgba(27,58,107,.055); display: flex; flex-direction: column; align-items: center; gap: 3px;">
              <span class="zh" style="font-size: 26px; font-weight: 700; color: #1B3A6B; line-height: 1;">国</span>
              <span style="font-size: 11px; color: #4A4A4A;">بلد</span>
            </div>
            <span style="font-family: 'Cairo'; font-size: 17px; font-weight: 800; color: #D4AF37; flex: none;">=</span>
            <div style="flex: 1; padding: 11px 8px; border-radius: 11px; background: rgba(200,16,46,.06); display: flex; flex-direction: column; align-items: center; gap: 3px;">
              <span class="zh" style="font-size: 26px; font-weight: 700; color: #C8102E; line-height: 1;">中国</span>
              <span style="font-size: 11px; color: #4A4A4A;">الصين</span>
            </div>
          </div>
        </div>

        <!-- تعبير الحفظ -->
        <div style="padding: 13px 14px; border-radius: 12px; background: rgba(212,175,55,.1); border-inline-start: 3px solid #D4AF37; display: flex; gap: 10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A6D12" stroke-width="1.8" stroke-linecap="round" style="flex: none; margin-top: 2px;"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5V15H8v-1.5A6 6 0 0 1 12 3Z"/></svg>
          <p style="font-size: 13px; line-height: 1.7; color: #4A4A4A;">«البلد الذي في <strong style="color: #2A2A2A;">وسط</strong> العالم» — هكذا سمّى الصينيون بلدهم، فالاسم يعني حرفياً «المملكة الوسطى».</p>
        </div>

        <!-- جملة -->
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #8A6D12;">في جملة</span>
          <div style="padding: 13px 14px; border-radius: 12px; background: rgba(42,42,42,.035); display: flex; flex-direction: column; gap: 5px;">
            <span class="zh" style="font-size: 19px; font-weight: 700; line-height: 1.5;">我是中国人。</span>
            <span style="font-size: 12px; color: #6E6E6E;">Wǒ shì Zhōngguó rén.</span>
            <span style="font-size: 13px;">أنا صيني.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 16px 24px; display: flex; gap: 10px;">
    <button style="flex: none; width: 54px; min-height: 54px; border-radius: 14px; border: 1px solid rgba(42,42,42,.14); background: #FFFFFF; display: grid; place-items: center; cursor: pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="1.9" stroke-linecap="round"><path d="M12 21s-7-4.4-7-9.5A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 3.5C19 16.6 12 21 12 21Z"/></svg>
    </button>
    <button style="flex: 1; min-height: 54px; border: 0; border-radius: 14px; background: #1B3A6B; color: #F7F4EF; font-family: 'Cairo'; font-size: 16px; font-weight: 800; cursor: pointer;">اكتبها الآن</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
