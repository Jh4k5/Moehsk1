<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Noto+Sans+SC:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Tajawal', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Cairo', system-ui, sans-serif; margin: 0; }
    p { margin: 0; }
    a { color: #1B3A6B; text-decoration: none; } a:hover { color: #24508F; }
    .zh { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; min-height: 844px; background: #F7F4EF; color: #2A2A2A; display: flex; flex-direction: column;">

  <div style="padding: 18px 16px 12px; display: flex; align-items: center; gap: 12px;">
    <button style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div style="flex: 1; height: 9px; border-radius: 999px; background: rgba(42,42,42,.10); overflow: hidden;"><div style="width: 36%; height: 100%; border-radius: 999px; background: #1B3A6B;"></div></div>
    <span style="font-size: 12px; font-weight: 700; color: #6E6E6E; flex: none;">٥/١٤</span>
  </div>

  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 15px; flex: 1;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 26px; height: 26px; border-radius: 8px; background: rgba(200,16,46,.09); display: grid; place-items: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="1.9" stroke-linecap="round"><path d="M5 19l7-14 7 14"/><path d="M8 14h8"/></svg>
      </span>
      <span style="font-size: 13px; font-weight: 700; color: #C8102E;">اكتب الحرف</span>
      <span style="margin-inline-start: auto; font-size: 11.5px; color: #8A8A8A;">الضربة ٤ من ٨</span>
    </div>

    <h1 style="font-size: 19px; font-weight: 800; line-height: 1.5;">اكتب <span class="zh" style="color: #1B3A6B;">国</span> بترتيب ضرباته</h1>

    <!-- لوح التتبّع -->
    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid rgba(42,42,42,.08); padding: 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="position: relative; aspect-ratio: 1; border-radius: 16px; background: #FBF9F5; border: 1.5px solid rgba(27,58,107,.14); overflow: hidden;">
        <!-- شبكة 米 الإرشادية -->
        <svg viewBox="0 0 300 300" style="position: absolute; inset: 0; width: 100%; height: 100%;">
          <line x1="150" y1="0" x2="150" y2="300" stroke="rgba(27,58,107,.14)" stroke-width="1.5" stroke-dasharray="7 7"/>
          <line x1="0" y1="150" x2="300" y2="150" stroke="rgba(27,58,107,.14)" stroke-width="1.5" stroke-dasharray="7 7"/>
          <line x1="0" y1="0" x2="300" y2="300" stroke="rgba(27,58,107,.08)" stroke-width="1.5" stroke-dasharray="7 7"/>
          <line x1="300" y1="0" x2="0" y2="300" stroke="rgba(27,58,107,.08)" stroke-width="1.5" stroke-dasharray="7 7"/>

          <!-- الحرف الشبح -->
          <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-family="'Noto Sans SC'" font-size="210" font-weight="700" fill="rgba(42,42,42,.07)">国</text>

          <!-- الضربات المكتملة -->
          <g stroke="#1B3A6B" stroke-width="11" stroke-linecap="round" fill="none">
            <path d="M72 62 V 240"/>
            <path d="M72 62 H 232"/>
            <path d="M232 62 V 240"/>
          </g>
          <!-- الضربة الحالية: مسار مقترح + سهم البداية -->
          <path d="M118 122 H 190" stroke="#C8102E" stroke-width="11" stroke-linecap="round" fill="none" stroke-dasharray="72" stroke-dashoffset="26"/>
          <circle cx="118" cy="122" r="13" fill="#C8102E"/>
          <text x="118" y="122" text-anchor="middle" dominant-baseline="central" font-family="'Cairo'" font-size="15" font-weight="800" fill="#FFF">٤</text>
        </svg>
      </div>

      <!-- شريط الضربات -->
      <div style="display: flex; gap: 6px; align-items: center;">
        <span style="flex: 1; height: 6px; border-radius: 999px; background: #1B3A6B;"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: #1B3A6B;"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: #1B3A6B;"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: #C8102E;"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: rgba(42,42,42,.12);"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: rgba(42,42,42,.12);"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: rgba(42,42,42,.12);"></span>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: rgba(42,42,42,.12);"></span>
      </div>

      <div style="display: flex; gap: 9px;">
        <button style="flex: 1; min-height: 44px; border: 1px solid rgba(42,42,42,.14); border-radius: 11px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B3A6B" stroke-width="1.9" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
          <span style="font-size: 13px; color: #1B3A6B;">أعد المحاولة</span>
        </button>
        <button style="flex: 1; min-height: 44px; border: 1px solid rgba(42,42,42,.14); border-radius: 11px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B3A6B" stroke-width="1.9" stroke-linecap="round"><path d="M5 4l12 8-12 8Z"/></svg>
          <span style="font-size: 13px; color: #1B3A6B;">أرِني الحركة</span>
        </button>
      </div>
    </div>

    <!-- تلميح -->
    <div style="padding: 13px 14px; border-radius: 12px; background: rgba(27,58,107,.05); border-inline-start: 3px solid #1B3A6B; display: flex; gap: 10px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1B3A6B" stroke-width="1.8" stroke-linecap="round" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/></svg>
      <p style="font-size: 12.5px; line-height: 1.7; color: #4A4A4A;">القاعدة: الإطار المغلق <span class="zh" style="font-weight: 700;">囗</span> يُكتب من ثلاث ضربات، ويُغلق قاعُه <strong style="color: #2A2A2A;">أخيراً</strong> بعد ما بداخله.</p>
    </div>
  </div>

  <div style="padding: 14px 16px 24px;">
    <button style="width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: rgba(42,42,42,.10); color: #8A8A8A; font-family: 'Cairo'; font-size: 16px; font-weight: 800; cursor: not-allowed;">أكمل الضربات الثماني</button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
